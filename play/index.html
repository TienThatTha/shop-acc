  <script>

        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimerId);
        toastTimerId = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2800);
      }

      function normalizeBaseUrl(rawUrl) {
        if (!rawUrl || typeof rawUrl !== 'string') return '';
        var trimmed = rawUrl.trim();
        if (!trimmed) return '';
        try {
          var parsed = new URL(trimmed);
          if (window.location.protocol === 'https:' && parsed.protocol !== 'https:') {
            return '';
          }
          if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') {
            return '';
          }
          return parsed.origin;
        } catch (e) {
          return '';
        }
      }

      function addCandidate(list, rawUrl) {
        var base = normalizeBaseUrl(rawUrl);
        if (base && list.indexOf(base) === -1) {
          list.push(base);
        }
      }

      function fetchWithTimeout(url, options, timeoutMs) {
        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timer = null;
        if (controller) {
          timer = setTimeout(function () {
            controller.abort();
          }, timeoutMs);
        }
        var opts = Object.assign({ cache: 'no-store' }, options || {});
        if (controller) {
          opts.signal = controller.signal;
        }
        return fetch(url, opts).finally(function () {
          if (timer) clearTimeout(timer);
        });
      }

      async function discoverCandidates() {
        var candidates = [];

        // Tầng 1: Supabase REST site_config -> mtc_server_registry
        setStep('Tầng 1/3: Đang đọc địa chỉ máy chủ từ Cloud Registry...');
        try {
          var supaEndpoint = SUPABASE_URL + '/rest/v1/site_config?id=eq.mtc_server_registry&select=value&apikey=' + encodeURIComponent(SUPABASE_ANON_KEY);
          var res1 = await fetchWithTimeout(supaEndpoint, {
            cache: 'no-store',
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: 'Bearer ' + SUPABASE_ANON_KEY
            }
          }, 5000);
          if (res1.ok) {
            var rows = await res1.json();
            var val = Array.isArray(rows) && rows[0] ? rows[0].value : null;
            if (val && typeof val === 'object') {
              addCandidate(candidates, val.base_url);
              addCandidate(candidates, val.server_url);
              addCandidate(candidates, val.online_url);
            }
          }
        } catch (e1) {}

        // Tầng 2: Dự phòng ntfy.sh
        setStep('Tầng 2/3: Đang kiểm tra kênh dự phòng Cloud...');
        try {
          var res2 = await fetchWithTimeout(NTFY_REGISTRY_URL, { cache: 'no-store' }, 5000);
          if (res2.ok) {
            var rawText = await res2.text();
            var lines = rawText.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
            for (var i = lines.length - 1; i >= 0; i--) {
              try {
                var item = JSON.parse(lines[i]);
                if (item && typeof item === 'object') {
                  addCandidate(candidates, item.base_url);
                  addCandidate(candidates, item.online_url);
                  addCandidate(candidates, item.server_url);
                }
              } catch (ignoreLine) {}
            }
          }
        } catch (e2) {}

        // Tầng 3: Dự phòng /download/version.json
        setStep('Tầng 3/3: Đang đọc cấu hình dự phòng nội bộ...');
        try {
          var res3 = await fetchWithTimeout(LOCAL_VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' }, 4000);
          if (res3.ok) {
            var vData = await res3.json();
            if (vData && typeof vData === 'object') {
              addCandidate(candidates, vData.base_url);
              addCandidate(candidates, vData.online_url);
            }
          }
        } catch (e3) {}

        return candidates;
      }

      async function probeBaseUrl(baseUrl) {
        try {
          var probeUrl = baseUrl + '/download/version.php?t=' + Date.now();
          var resp = await fetchWithTimeout(probeUrl, { cache: 'no-store' }, PROBE_TIMEOUT_MS);
          if (resp.status !== 200) return false;
          var json = await resp.json();
          return Boolean(json && typeof json === 'object' && (json.app_id || json.base_url || json.version_code));
        } catch (e) {
          return false;
        }
      }

      function extractAccessTokenFromParsed(obj, nowSec) {
        if (!obj || typeof obj !== 'object') return '';
        var sessionObj = obj.access_token ? obj : (obj.currentSession && obj.currentSession.access_token ? obj.currentSession : null);
        if (!sessionObj || typeof sessionObj.access_token !== 'string' || !sessionObj.access_token.trim()) {
          return '';
        }
        var expRaw = Number(sessionObj.expires_at);
        if (Number.isFinite(expRaw) && expRaw > 0) {
          var expSec = expRaw > 1e12 ? Math.floor(expRaw / 1000) : expRaw;
          if (expSec <= nowSec + 15) return '';
        }
        return sessionObj.access_token.trim();
      }

      function readShopSsoToken() {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('nosso') === '1') return '';
        } catch (e) {}

        var nowSec = Math.floor(Date.now() / 1000);
        try {
          var keys = [];
          for (var i = 0; i < window.localStorage.length; i++) {
            var k = window.localStorage.key(i);
            if (k) keys.push(k);
          }

          // Ưu tiên key chuẩn của Supabase: sb-*-auth-token
          keys.sort(function (a, b) {
            var aPref = a.indexOf('sb-') === 0 && a.slice(-11) === '-auth-token' ? 0 : 1;
            var bPref = b.indexOf('sb-') === 0 && b.slice(-11) === '-auth-token' ? 0 : 1;
            return aPref - bPref;
          });

          for (var j = 0; j < keys.length; j++) {
            var rawVal = window.localStorage.getItem(keys[j]);
            if (!rawVal || rawVal.indexOf('access_token') === -1) continue;
            try {
              var parsed = JSON.parse(rawVal);
              var token = extractAccessTokenFromParsed(parsed, nowSec);
              if (token) return token;
            } catch (ignoreParse) {}
          }
        } catch (eStorage) {}
        return '';
      }

        var secLeft = RETRY_INTERVAL_SEC;
        setStep('Tự động kết nối lại sau ' + secLeft + ' giây...');
        countdownTimerId = setInterval(function () {
          secLeft -= 1;
          if (secLeft > 0) {
            setStep('Tự động kết nối lại sau ' + secLeft + ' giây...');
          } else {
            clearInterval(countdownTimerId);
          }
        }, 1000);

        retryTimerId = setTimeout(function () {
          connectToLiveServer();
        }, RETRY_INTERVAL_SEC * 1000);
      }

      function clearTimers() {
        if (retryTimerId) {
          clearTimeout(retryTimerId);
          retryTimerId = null;
        }
        if (countdownTimerId) {
          clearInterval(countdownTimerId);
          countdownTimerId = null;
        }
      }

      function hideOverlaySoon() {
        setTimeout(function () {
          overlayEl.classList.add('hidden');
        }, 250);
      }

      async function connectToLiveServer() {
        if (isConnecting) return;
        isConnecting = true;
        showConnectingState();

        try {
          var candidates = await discoverCandidates();
          var liveBase = '';

          for (var i = 0; i < candidates.length; i++) {
            setStep('Đang kiểm tra đường truyền (' + (i + 1) + '/' + candidates.length + ')...');
            var ok = await probeBaseUrl(candidates[i]);
            if (ok) {
              liveBase = candidates[i];
              break;
            }
          }

          if (!liveBase) {
            isConnecting = false;
            showOfflineState();
            return;
          }

          activeBaseUrl = liveBase;
          var ssoToken = readShopSsoToken();
          var targetUrl = liveBase + '/?server=s0-beta&embed=1';
          if (ssoToken) {
            targetUrl += '&sso_token=' + encodeURIComponent(ssoToken);
          }

          setStep(ssoToken ? 'Đã đồng bộ tài khoản ShopTiếnGaming, đang vào game...' : 'Đã tìm thấy máy chủ, đang mở cổng game...');

          var settled = false;
          var fallbackReveal = setTimeout(function () {
            if (!settled) {
              settled = true;
              hideOverlaySoon();
            }
          }, 4500);

          frameEl.onload = function () {
            if (!settled) {
              settled = true;
              clearTimeout(fallbackReveal);
              hideOverlaySoon();
            }
          };

          frameEl.src = targetUrl;
        } catch (err) {
          showOfflineState();
        } finally {
          isConnecting = false;
        }
      }

      // --- THANH MENU NỔI KÉO THẢ (CHUỘT + CẢM ỨNG CHẠM) ---
      var MARGIN = 10;
      var pillPos = { left: null, top: null };
      var isMenuOpen = false;

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function getViewportBounds() {
        var w = window.innerWidth || document.documentElement.clientWidth || 360;
        var h = window.innerHeight || document.documentElement.clientHeight || 640;
        return { w: w, h: h };
      }

      function applyPillPosition(left, top) {
        var bounds = getViewportBounds();
        var rect = hubEl.getBoundingClientRect();
        var pw = rect.width || 92;
        var ph = rect.height || 34;

        var clampedLeft = clamp(left, MARGIN, Math.max(MARGIN, bounds.w - pw - MARGIN));
        var clampedTop = clamp(top, MARGIN, Math.max(MARGIN, bounds.h - ph - MARGIN));
        pillPos.left = clampedLeft;
        pillPos.top = clampedTop;

        hubEl.style.left = clampedLeft + 'px';
        hubEl.style.top = clampedTop + 'px';
        hubEl.style.right = 'auto';
        hubEl.style.bottom = 'auto';

        if (isMenuOpen) {
          positionMenuPanel();
        }
      }

      function initPillPosition() {
        var bounds = getViewportBounds();
        var rect = hubEl.getBoundingClientRect();
        var pw = rect.width || 92;
        applyPillPosition(bounds.w - pw - 12, 54);
      }

      function positionMenuPanel() {
        var bounds = getViewportBounds();
        var pillRect = hubEl.getBoundingClientRect();
        var panelW = Math.min(224, bounds.w - 20);
        var panelH = menuPanel.offsetHeight || 270;

        var left = pillRect.left + pillRect.width - panelW;
        left = clamp(left, MARGIN, Math.max(MARGIN, bounds.w - panelW - MARGIN));

        var top = pillRect.bottom + 8;
        if (top + panelH > bounds.h - MARGIN) {
          top = pillRect.top - panelH - 8;
        }
        top = clamp(top, MARGIN, Math.max(MARGIN, bounds.h - panelH - MARGIN));

        menuPanel.style.left = left + 'px';
        menuPanel.style.top = top + 'px';
      }

      function setMenuOpen(open) {
        isMenuOpen = Boolean(open);
        menuPanel.classList.toggle('open', isMenuOpen);
        toggleBtn.setAttribute('aria-expanded', isMenuOpen ? 'true' : 'false');
        if (isMenuOpen) {
          positionMenuPanel();
        }
      }

      (function setupDrag() {
        var dragging = false;
        var moved = false;
        var startX = 0;
        var startY = 0;
        var originLeft = 0;
        var originTop = 0;

        function onStart(clientX, clientY) {
          var rect = hubEl.getBoundingClientRect();
          dragging = true;
          moved = false;
          startX = clientX;
          startY = clientY;
          originLeft = rect.left;
          originTop = rect.top;
        }

        function onMove(clientX, clientY) {
          if (!dragging) return;
          var dx = clientX - startX;
          var dy = clientY - startY;
          if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
            moved = true;
            if (isMenuOpen) setMenuOpen(false);
          }
          if (moved) {
            applyPillPosition(originLeft + dx, originTop + dy);
          }
        }

        function onEnd() {
          if (!dragging) return;
          dragging = false;
          if (!moved) {
            setMenuOpen(!isMenuOpen);
          }
        }

        if (window.PointerEvent) {
          toggleBtn.addEventListener('pointerdown', function (e) {
            if (e.button !== undefined && e.button !== 0) return;
            toggleBtn.setPointerCapture(e.pointerId);
            onStart(e.clientX, e.clientY);
          });
          toggleBtn.addEventListener('pointermove', function (e) {
            onMove(e.clientX, e.clientY);
          });
          toggleBtn.addEventListener('pointerup', function () {
            onEnd();
          });
          toggleBtn.addEventListener('pointercancel', function () {
            dragging = false;
          });
        } else {
          toggleBtn.addEventListener('mousedown', function (e) {
            onStart(e.clientX, e.clientY);
          });
          window.addEventListener('mousemove', function (e) {
            onMove(e.clientX, e.clientY);
          });
          window.addEventListener('mouseup', function () {
            onEnd();
          });
          toggleBtn.addEventListener('touchstart', function (e) {
            if (!e.touches[0]) return;
            onStart(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });
          window.addEventListener('touchmove', function (e) {
            if (!dragging || !e.touches[0]) return;
            onMove(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });
          window.addEventListener('touchend', function () {
            onEnd();
          });
        }
      })();

      document.addEventListener('click', function (e) {
        if (!isMenuOpen) return;
        if (!hubEl.contains(e.target) && !menuPanel.contains(e.target)) {
          setMenuOpen(false);
        }
      });

      window.addEventListener('resize', function () {
        if (pillPos.left !== null && pillPos.top !== null) {
          applyPillPosition(pillPos.left, pillPos.top);
        } else {
          initPillPosition();
        }
      });

      menuPanel.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        setMenuOpen(false);

        if (action === 'fullscreen') {
          var doc = document;
          var root = document.documentElement;
          var fsEl = doc.fullscreenElement || doc.webkitFullscreenElement;
          if (!fsEl) {
            var req = root.requestFullscreen || root.webkitRequestFullscreen;
            if (req) {
              Promise.resolve(req.call(root)).catch(function () {
                showToast('Trình duyệt này chưa hỗ trợ toàn màn hình — hãy "Thêm vào Màn hình chính"!');
              });
            } else {
              showToast('Trên iPhone Safari: bấm Chia sẻ -> Thêm vào Màn hình chính để chơi toàn màn hình!');
            }
          } else {
            var exit = doc.exitFullscreen || doc.webkitExitFullscreen;
            if (exit) exit.call(doc);
          }
        } else if (action === 'topup') {
          window.open('/?view=naptien', '_blank', 'noopener');
        } else if (action === 'reload') {
          connectToLiveServer();
        } else if (action === 'switch-account') {
          try {
            window.history.replaceState(null, '', '/play/?nosso=1');
          } catch (ignoreHist) {}
          if (activeBaseUrl) {
            frameEl.src = activeBaseUrl + '/action?logout=1&embed=1';
            showToast('Đang đăng xuất để chuyển tài khoản...');
          } else {
            window.location.href = '/play/?nosso=1';
          }
        } else if (action === 'home') {
          window.location.href = '/';
        }
      });

      retryNowBtn.addEventListener('click', function () {
        connectToLiveServer();
      });

      window.addEventListener('message', function (event) {
        if (!activeBaseUrl || event.origin !== activeBaseUrl) return;
        var msg = event.data;
        if (msg && msg.type === 'mtc_open_topup') {
          window.open('/?view=naptien', '_blank', 'noopener');
        }
      });

      initPillPosition();
      connectToLiveServer();
    })();
  </script>
</body>
</html>
